<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
<title id="title">How I build</title><desc id="desc">Local first. Small surface. Clear purpose. Release deliberately.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090B0F"/><stop offset="1" stop-color="#101319"/></linearGradient><radialGradient id="gold" cx="35%" cy="30%" r="70%"><stop stop-color="#FFE7A4"/><stop offset="0.45" stop-color="#D9A84E"/><stop offset="1" stop-color="#8A5B18"/></radialGradient></defs>
<rect width="1200" height="260" rx="28" fill="url(#bg)"/>
<g transform="translate(112 130)">
  <circle r="54" fill="url(#gold)" stroke="#F3D485" stroke-opacity="0.5"/>
  <path d="M-21,-12 L0,-28 L25,-10 L19,21 L-6,31 L-29,10 Z" fill="#805216" opacity="0.32"/>
  <circle r="38" fill="none" stroke="#FFF2C7" stroke-opacity="0.18"/>
</g>
<text x="205" y="73" fill="#7B8490" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="3">HOW I BUILD</text>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="205" y="126" fill="#F0ECE3" font-size="21" font-weight="620">LOCAL FIRST</text>
  <text x="442" y="126" fill="#F0ECE3" font-size="21" font-weight="620">SMALL SURFACE</text>
  <text x="710" y="126" fill="#F0ECE3" font-size="21" font-weight="620">CLEAR PURPOSE</text>
  <text x="1018" y="116" fill="#F0ECE3" font-size="19" font-weight="620" text-anchor="middle">RELEASE</text>
  <text x="1018" y="143" fill="#D9A84E" font-size="19" font-weight="620" text-anchor="middle">DELIBERATELY</text>
</g>
<rect x="205" y="151" width="151" height="2" rx="1" fill="#303640"/><rect x="369" y="151" width="27" height="2" rx="1" fill="#D9A84E"/>
<text x="205" y="202" fill="#858D98" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">AI is a tool in the process, not the identity of the product.</text>
</svg>
