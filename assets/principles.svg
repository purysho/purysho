<svg width="1280" height="230" viewBox="0 0 1280 230" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="panel" x1="0" y1="0" x2="1280" y2="230"><stop stop-color="#0B0C12"/><stop offset="1" stop-color="#07080C"/></linearGradient>
  <linearGradient id="accent" x1="84" y1="0" x2="1180" y2="0"><stop stop-color="#A78BFA"/><stop offset="0.55" stop-color="#67E8F9"/><stop offset="1" stop-color="#FBBF24"/></linearGradient>
</defs>
<rect width="1280" height="230" rx="30" fill="url(#panel)"/>
<rect x="1" y="1" width="1278" height="228" rx="29" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
<text x="52" y="50" fill="#8F93A3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="700" letter-spacing="2">HOW I LIKE TO BUILD</text>
<rect x="52" y="66" width="1176" height="1.5" rx="1" fill="url(#accent)" fill-opacity="0.55"/>
<g transform="translate(52 95)">
  <g><text x="0" y="18" fill="#A78BFA" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700">01</text><text x="0" y="54" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" font-weight="700" letter-spacing="-0.7">Local first.</text><text x="0" y="82" fill="#8F93A3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">Keep data close when it can stay close.</text></g>
  <g transform="translate(300 0)"><text x="0" y="18" fill="#67E8F9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700">02</text><text x="0" y="54" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" font-weight="700" letter-spacing="-0.7">Small surface.</text><text x="0" y="82" fill="#8F93A3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">A focused tool beats a crowded product.</text></g>
  <g transform="translate(602 0)"><text x="0" y="18" fill="#79F2A7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700">03</text><text x="0" y="54" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" font-weight="700" letter-spacing="-0.7">AI with purpose.</text><text x="0" y="82" fill="#8F93A3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">Use models where they materially help.</text></g>
  <g transform="translate(904 0)"><text x="0" y="18" fill="#FBBF24" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700">04</text><text x="0" y="54" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" font-weight="700" letter-spacing="-0.7">Ship real software.</text><text x="0" y="82" fill="#8F93A3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">Useful, runnable, and finished enough to use.</text></g>
</g>
</svg>