<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Purysho profile header">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090d"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8ff2c"/>
      <stop offset="1" stop-color="#27e1ff"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>

  <path d="M0 88H1200" stroke="#ffffff" stroke-opacity="0.06"/>
  <path d="M0 292H1200" stroke="#ffffff" stroke-opacity="0.06"/>

  <g opacity="0.8">
    <circle cx="70" cy="48" r="6" fill="#ff5f57"/>
    <circle cx="92" cy="48" r="6" fill="#febc2e"/>
    <circle cx="114" cy="48" r="6" fill="#28c840"/>
    <text x="146" y="54" fill="#7d8590" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">profile://purysho</text>
  </g>

  <g transform="translate(74 124)">
    <rect x="0" y="0" width="10" height="108" rx="5" fill="url(#accent)" filter="url(#glow)"/>
    <text x="42" y="66" fill="#f0f6fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="5">PURYSHO</text>
    <text x="45" y="108" fill="#9da7b3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" letter-spacing="2">LOCAL-FIRST TOOLS  /  AI SYSTEMS  /  SOFTWARE EXPERIMENTS</text>
  </g>

  <g transform="translate(870 118)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M88 0L176 50V150L88 200L0 150V50Z" stroke="url(#accent)" stroke-width="3" opacity="0.95"/>
    <path d="M88 24L154 62V138L88 176L22 138V62Z" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>
    <path d="M88 56L126 78V122L88 144L50 122V78Z" stroke="#b8ff2c" stroke-opacity="0.75" stroke-width="2"/>
    <circle cx="88" cy="100" r="8" fill="#27e1ff" stroke="none" filter="url(#glow)"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#6e7681">
    <text x="74" y="328">BUILD / TEST / BREAK / REFINE / SHIP</text>
    <text x="950" y="328">STATUS: ONLINE</text>
  </g>
</svg>