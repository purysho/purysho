<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-labelledby="title desc">
<title id="title">PalisadeDB</title><desc id="desc">A custom local database engine built from first principles.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17130D"/><stop offset="1" stop-color="#0B0907"/></linearGradient><radialGradient id="gold" cx="35%" cy="25%" r="75%"><stop stop-color="#FFE6A0"/><stop offset="0.5" stop-color="#D9A84E"/><stop offset="1" stop-color="#875917"/></radialGradient></defs>
<rect width="400" height="300" rx="24" fill="url(#bg)" stroke="#2A2419"/>
<text x="30" y="42" fill="#D9A84E" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2.8">DATABASE ENGINE</text>
<g transform="translate(300 88)">
  <rect x="-41" y="-36" width="82" height="73" rx="9" fill="#13110D" stroke="#66512A"/>
  <path d="M-30,-36 V-52 H-15 V-36 H-6 V-56 H9 V-36 H18 V-52 H33 V-36" fill="#17130D" stroke="#866A34" stroke-width="6" stroke-linejoin="round"/>
