<text x="30" y="119" fill="#F2EEE5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="650">PalisadeDB</text>
<text x="30" y="159" fill="#A69F93" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">A database built from the storage layer upward.</text>
<text x="30" y="205" fill="#746C60" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Pager · B+ tree · SQL · recovery</text>
