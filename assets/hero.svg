      <stop offset="0.5" stop-color="#2A323D" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="glass2" x1="1" y1="0" x2="0" y2="1">
