<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Purysho — Ideas into useful things.</title>
  <desc id="desc">Dark liquid-glass identity banner with a fragmented geometric mark and gold core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090D"/>
      <stop offset="0.55" stop-color="#0B0E13"/>
      <stop offset="1" stop-color="#11151C"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
